
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membean — Student Home</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #26384d;
      color: #edf5ff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(420px, calc(100% - 48px));
      padding: 32px;
      box-sizing: border-box;
      background: #14263a;
      border: 1px solid #2a4058;
      border-radius: 16px;
      text-align: center;
    }
    .brand {
      color: #70cf56;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 18px;
    }
    p {
      color: #b4c6da;
      line-height: 1.6;
    }
    a {
      display: block;
      margin-top: 24px;
      padding: 15px;
      border-radius: 9px;
      background: #15518a;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { background: #1b609f; }
  </style>
</head>
<body>
  <main>
    <div class="brand">❧ membean</div>
    <h1>Student Home</h1>
    <p>Sign in to your real Membean account to open your dashboard and continue your vocabulary training.</p>
    <a href="https://membean.com/login">
      Sign in to Membean →
    </a>
  </main>
</body>
</html>
