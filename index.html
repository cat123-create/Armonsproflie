
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordQuest Vocabulary</title>
<style>
body{margin:0;background:#f1f5ff;color:#192642;font-family:Arial,sans-serif}
header{background:white;padding:18px;text-align:center;font-size:25px;font-weight:bold;color:#315fe8}
main{max-width:700px;margin:25px auto;padding:15px}
.card{background:white;padding:24px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 15px #0001}
button{padding:13px 18px;border:0;border-radius:9px;background:#315fe8;color:white;font-weight:bold;cursor:pointer;margin:5px}
button:hover{opacity:.85}
input{padding:12px;border:1px solid #ccd4e4;border-radius:8px;width:90%;max-width:400px;margin:10px 0}
.hidden{display:none!important}
.word{font-size:42px;font-weight:bold;margin:20px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers button{background:#f0f4ff;color:#192642;border:1px solid #ccd4e4;min-height:60px}
.answers button:disabled{opacity:1}
.stats{display:flex;justify-content:space-around;gap:10px;text-align:center}
.stats strong{font-size:24px;display:block}
.muted{color:#68758c;line-height:1.5}
.correct{background:#d9f8e5!important;border-color:#29965c!important}
.wrong{background:#ffe1e1!important}
#feedback{font-weight:bold;min-height:24px}
@media(max-width:500px){.answers{grid-template-columns:1fr}.card{padding:17px}.word{font-size:34px}}
</style>
</head>
<body>
<header>✦ WordQuest</header>
<main>
<section id="welcome" class="card">
<h1>Learn new words!</h1>
<p class="muted">Start easy, earn XP, and unlock harder vocabulary.</p>
<label for="player">What is your name?</label><br>
<input id="player" placeholder="Enter your name" maxlength="30">
<br><button id="begin">Start learning →</button>
<p id="message" class="muted"></p>
</section>

<section id="home" class="card hidden">
<h1>Welcome, <span id="name"></span>!</h1>
<div class="stats">
<div>Level<strong id="level">1</strong></div>
<div>Words learned<strong id="learned">0</strong></div>
<div>XP<strong id="xp">0</strong></div>
</div>
<p class="muted" id="progress"></p>
<button id="play">▶ Play</button>
<button id="rename">Change name</button>
<button id="reset">Reset progress</button>
</section>

<section id="quiz" class="card hidden" style="text-align:center">
<p id="number" class="muted"></p>
<div id="word" class="word"></div>
<p>What does this word mean?</p>
<div id="answers" class="answers"></div>
<p id="feedback"></p>
<p id="example" class="muted"></p>
<button id="next" class="hidden">Next word →</button>
<button id="finish">Finish session</button>
</section>

<section id="done" class="card hidden" style="text-align:center">
<h1>Great job! 🎉</h1>
<p id="summary" class="muted"></p>
<button id="again">Play again</button>
<button id="back">Home</button>
</section>

<section id="review" class="card hidden">
<h2>📚 Review these words</h2>
<div id="reviewWords" class="muted">No words to review yet.</div>
</section>
</main>
<script>
(function(){
"use strict";
const words=[
["happy","feeling pleased or glad","She was happy to see her friend.",1],
["tiny","very small","A tiny bird sat on the fence.",1],
["calm","peaceful and not upset","He stayed calm during the storm.",1],
["rapid","happening very quickly","The rapid runner won the race.",1],
["assist","to help someone","I will assist you with your homework.",1],
["ancient","very old","They visited an ancient castle.",1],
["observe","to watch carefully","Scientists observe the stars.",1],
["fragile","easily broken","The fragile glass needs care.",1],
["fortunate","having good luck","We were fortunate to find a seat.",1],
["reluctant","unwilling or hesitant","She was reluctant to speak.",2],
["abundant","existing in large quantities","The forest has abundant wildlife.",2],
["infer","to reach a conclusion from clues","We can infer the answer from the evidence.",2],
["precise","exact and accurate","Please give a precise measurement.",2],
["diligent","careful and hardworking","The diligent student studied every day.",2],
["inevitable","certain to happen","Change is inevitable.",2],
["resilient","able to recover after difficulty","The resilient team kept trying.",2],
["ambiguous","having more than one possible meaning","The ambiguous clue confused us.",3],
["meticulous","extremely careful about details","She kept meticulous notes.",3],
["pragmatic","focused on practical solutions","They chose a pragmatic solution.",3],
["ubiquitous","found almost everywhere","Phones are ubiquitous in many cities.",3],
["ephemeral","lasting for a short time","The rainbow was ephemeral.",3],
["eloquent","fluent and persuasive in speaking","His eloquent speech inspired us.",3],
["scrutinize","to examine very closely","Reviewers scrutinize each detail.",3],
["benevolent","kind and generous","The benevolent neighbor helped everyone.",3],
["conundrum","a difficult problem or puzzle","The puzzle was a conundrum.",3],
["mitigate","to make something less severe","Trees can mitigate heat.",3],
["arduous","requiring great effort","The arduous climb took all day.",3]
];
const $=id=>document.getElementById(id);
const key="wordquest_pasteable_v2";
let data={name:"",xp:0,learned:[],review:[],seen:{}},session=null;
try{const old=JSON.parse(localStorage.getItem(key)||"null");if(old&&typeof old==="object")data=Object.assign(data,old)}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function level(){return Math.min(10,1+Math.floor(data.xp/100))}
function difficulty(){return level()<3?1:level()<6?2:3}
function show(id){["welcome","home","quiz","done","review"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function dashboard(){
 $("name").textContent=data.name;
 $("level").textContent=level();
 $("learned").textContent=data.learned.length;
 $("xp").textContent=data.xp;
 $("progress").textContent=(data.xp%100)+" / 100 XP to the next level";
 const box=$("reviewWords");box.replaceChildren();
 if(!data.review.length)box.textContent="No words to review yet.";
 data.review.forEach(w=>{
  const item=words.find(x=>x[0]===w);if(!item)return;
  const p=document.createElement("p");p.textContent=item[0]+": "+item[1];box.appendChild(p);
 });
 save();
}
function start(){
 const pool=words.filter(w=>w[3]<=difficulty()&&!data.learned.includes(w[0]));
 const queue=[];
 data.review.forEach(w=>{const item=words.find(x=>x[0]===w);if(item&&queue.length<3&&!queue.includes(item))queue.push(item)});
 const rest=pool.filter(w=>!queue.includes(w));
 while(queue.length<10&&rest.length){queue.push(rest.splice(Math.floor(Math.random()*rest.length),1)[0])}
 if(!queue.length)words.filter(w=>w[3]<=difficulty()).sort(()=>Math.random()-.5).slice(0,10).forEach(w=>queue.push(w));
 session={queue:queue,index:0,correct:0,locked:false};
 show("quiz");ask();
}
function ask(){
 if(session.index>=session.queue.length){finish();return}
 const item=session.queue[session.index];session.locked=false;
 $("number").textContent="QUESTION "+(session.index+1)+" OF "+session.queue.length+" · LEVEL "+item[3];
 $("word").textContent=item[0];$("feedback").textContent="";$("example").textContent="";
 $("next").classList.add("hidden");
 const choices=[item[1]],pool=words.filter(w=>w[0]!==item[0]);
 while(choices.length<4&&pool.length){
  const i=Math.floor(Math.random()*pool.length),m=pool.splice(i,1)[0][1];
  if(!choices.includes(m))choices.push(m);
 }
 choices.sort(()=>Math.random()-.5);
 const box=$("answers");box.replaceChildren();
 choices.forEach(choice=>{
  const b=document.createElement("button");b.textContent=choice;
  b.addEventListener("click",()=>answer(b,choice===item[1]));box.appendChild(b);
 });
}
function answer(button,correct){
 if(session.locked)return;session.locked=true;
 const item=session.queue[session.index];
 Object.keys(data.seen).includes(item[0])?data.seen[item[0]]++:data.seen[item[0]]=1;
 [...$("answers").children].forEach(b=>{b.disabled=true;if(b.textContent===item[1])b.classList.add("correct")});
 if(correct){
  session.correct++;data.xp+=10+item[3]*5;
  $("feedback").textContent="Correct! +"+(10+item[3]*5)+" XP";$("feedback").style.color="#168553";
  if(!data.learned.includes(item[0])&&(data.seen[item[0]]>=2||Math.random()<.35)){
   data.learned.push(item[0]);data.review=data.review.filter(w=>w!==item[0]);
  }
 }else{
  button.classList.add("wrong");if(!data.review.includes(item[0]))data.review.push(item[0]);
  $("feedback").textContent="Not quite! The correct answer is highlighted."; $("feedback").style.color="#b52e36";
 }
 $("example").textContent="Example: "+item[2];
 $("next").classList.remove("hidden");dashboard();
}
function finish(){
 const correct=session?session.correct:0,total=session?session.queue.length:0;session=null;
 $("summary").textContent="You answered "+correct+" out of "+total+" questions correctly. Keep practicing to unlock harder words!";
 dashboard();show("done");
}
$("begin").addEventListener("click",()=>{
 const name=$("player").value.trim();
 if(!name){$("message").textContent="Please enter your name first.";return}
 data.name=name;dashboard();show("home");
});
$("player").addEventListener("keydown",e=>{if(e.key==="Enter")$("begin").click()});
$("play").addEventListener("click",start);
$("again").addEventListener("click",start);
$("back").addEventListener("click",()=>{dashboard();show("home")});
$("next").addEventListener("click",()=>{session.index++;ask()});
$("finish").addEventListener("click",finish);
$("rename").addEventListener("click",()=>{show("welcome");$("player").value=data.name});
$("reset").addEventListener("click",()=>{
 if(confirm("Reset your saved progress?")){
  data={name:data.name,xp:0,learned:[],review:[],seen:{}};dashboard();show("home");
 }
});
if(data.name){$("player").value=data.name;$("message").textContent="Welcome back, "+data.name+". Your saved progress is ready."; $("begin").textContent="Continue →";}
})();
</script>
</body>
</html>
